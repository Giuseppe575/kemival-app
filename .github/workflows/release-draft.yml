name: Prepare Microsoft Store candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Validate existing version tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid version tag' }
          git rev-parse --verify "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Tag does not exist' }
          $version = (Get-Content installer/package.json | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag and package version differ' }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            installer/package-lock.json
      - name: Install and test application
        run: npm ci && npm test
      - name: Install and test desktop
        working-directory: installer
        run: npm ci && npm test && npm run test:runtime
      - name: Build and verify Store package
        working-directory: installer
        run: npm run release:build
      - uses: actions/upload-artifact@v4
        with:
          name: kemival-store-${{ inputs.tag }}
          path: |
            installer/dist-store/*.appx
            sbom/*.json
            THIRD_PARTY_NOTICES.txt
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
